name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          rm -rf /tmp/cupion-site
          mkdir -p /tmp/cupion-site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'scripts' \
            --exclude '.gitignore' \
            ./ /tmp/cupion-site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/cupion-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
