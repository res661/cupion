<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Cupion</title>
  <link rel="icon" href="favicon.svg">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('cupion-theme') || 'auto'; } catch (e) {}
      var scheme = (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme) || '';
      var sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = t === 'dark' || (t === 'auto' && (scheme === 'dark' || (!scheme && sysDark)));
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
  <div id="app"></div>
  <script src="js/telegram.js?v=1"></script>
  <script src="js/mock.js?v=1"></script>
  <script src="js/api.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
